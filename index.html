  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code City</title>
  <link rel="stylesheet" href="/src/edge/shell.css">
</head>
<body>
  <main>
    <h1>Code City</h1>
    <section data-form>
      <form novalidate>
        <label for="repository">GitHub repository URL</label>
        <input id="repository" name="repository" type="text" inputmode="url" autocomplete="off" spellcheck="false">
        <button type="submit">Submit</button>
        <p data-feedback role="alert" aria-live="polite"></p>
      </form>
    </section>
    <section data-status aria-live="polite"></section>
    <output data-commit aria-live="polite"></output>
    <p id="city-navigation-instructions">Keyboard navigation: use W, A, S, and D to orbit; hold Shift with W, A, S, or D to pan; use + and − to zoom; use 0 or Reset view to return to the overview. Use the arrow keys to traverse buildings, Home or End to select the first or last building, and Escape to clear selection.</p>
    <section data-city-publication>
      <section data-city aria-label="Code city"></section>
    </section>
    <button data-city-reset type="button">Reset view</button>
  </main>
  <script type="module" src="/src/edge/main.ts"></script>
</body>
</html>
