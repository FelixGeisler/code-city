<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Code City current context and accepted target boundary</title>
  <desc id="desc">The current user accesses a static Code City browser application from GitHub Pages. The browser reads public repository evidence from GitHub. A separate dashed target area states that server authority is accepted but unimplemented and its mechanisms are unresolved.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.external{fill:#eef2ff;stroke:#4338ca;stroke-width:2}.target{fill:#fff7ed;stroke:#c2410c;stroke-width:2;stroke-dasharray:10 7}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:600 22px system-ui,sans-serif;fill:#0f172a}.text{font:18px system-ui,sans-serif;fill:#334155}.small{font:16px system-ui,sans-serif;fill:#475569}.targetText{fill:#9a3412}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="50" y="52" class="label">Current browser-only context</text>
  <rect x="60" y="120" width="220" height="130" rx="12" class="external"/>
  <text x="170" y="170" text-anchor="middle" class="label">User</text>
  <text x="170" y="205" text-anchor="middle" class="text">Analyze and investigate</text>
  <rect x="430" y="90" width="340" height="210" rx="12" class="box"/>
  <text x="600" y="140" text-anchor="middle" class="label">Code City in browser</text>
  <text x="600" y="178" text-anchor="middle" class="text">Controller and semantic UI</text>
  <text x="600" y="210" text-anchor="middle" class="text">One processing worker</text>
  <text x="600" y="242" text-anchor="middle" class="text">WebGL2 presentation</text>
  <text x="600" y="272" text-anchor="middle" class="small">No Code City server or persistence</text>
  <rect x="900" y="70" width="240" height="120" rx="12" class="external"/>
  <text x="1020" y="118" text-anchor="middle" class="label">GitHub Pages</text>
  <text x="1020" y="153" text-anchor="middle" class="text">Static package</text>
  <rect x="900" y="240" width="240" height="140" rx="12" class="external"/>
  <text x="1020" y="286" text-anchor="middle" class="label">Public GitHub</text>
  <text x="1020" y="321" text-anchor="middle" class="text">Revision and tree</text>
  <text x="1020" y="351" text-anchor="middle" class="text">Raw source content</text>
  <path d="M280 185 H425" class="line"/>
  <text x="352" y="172" text-anchor="middle" class="small">HTTPS</text>
  <path d="M900 130 H780" class="line"/>
  <text x="840" y="116" text-anchor="middle" class="small">assets</text>
  <path d="M770 260 H892" class="line"/>
  <text x="832" y="246" text-anchor="middle" class="small">anonymous reads</text>
  <rect x="60" y="465" width="1080" height="175" rx="12" class="target"/>
  <text x="90" y="510" class="label targetText">Accepted target — unimplemented</text>
  <text x="90" y="550" class="text">A Code City server owns source acquisition, analysis, retained source-result association,</text>
  <text x="90" y="582" class="text">and saved investigations. The browser owns presentation and investigation.</text>
  <text x="90" y="616" class="small targetText">Server, API, storage, access, security, and deployment mechanisms are unresolved.</text>
</svg>
