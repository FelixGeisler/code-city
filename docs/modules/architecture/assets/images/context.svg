<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">Code City system context</title>
  <desc id="desc">The user submits a public repository, navigates its Code City, and inspects a selected building. GitHub Pages supplies static assets. Code City requests public repository data directly from GitHub.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>
  <style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2}.core{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.t{font:18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:14px system-ui,sans-serif;fill:#334155;text-anchor:middle}.a{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect class="b" x="30" y="140" width="170" height="90" rx="8"/><text class="t" x="115" y="178">User</text><text class="s" x="115" y="205">URL, controls, inspection</text>
  <rect class="core" x="340" y="110" width="240" height="150" rx="8"/><text class="t" x="460" y="160">Code City</text><text class="s" x="460" y="190">Interactive browser app</text><text class="s" x="460" y="215">No backend</text>
  <rect class="b" x="700" y="35" width="180" height="90" rx="8"/><text class="t" x="790" y="73">GitHub Pages</text><text class="s" x="790" y="100">Static assets</text>
  <rect class="b" x="700" y="255" width="180" height="90" rx="8"/><text class="t" x="790" y="293">Public GitHub</text><text class="s" x="790" y="320">Repository data</text>
  <line class="a" x1="200" y1="185" x2="330" y2="185"/><line class="a" x1="340" y1="215" x2="210" y2="215"/>
  <line class="a" x1="700" y1="95" x2="590" y2="145"/><line class="a" x1="580" y1="225" x2="690" y2="285"/><line class="a" x1="700" y1="315" x2="590" y2="245"/>
</svg>
