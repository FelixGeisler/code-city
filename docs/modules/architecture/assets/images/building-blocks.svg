<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Current Code City building blocks and accepted target responsibility boundary</title>
  <desc id="desc">The browser main context contains semantic publication, the controller, and the WebGL presenter. One worker contains GitHub gateways, attempt orchestration, admission, parsing, metrics, and city construction. Domain policy supports both contexts. A dashed target note moves acquisition and analysis authority to an unimplemented server without choosing its design.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.frame{fill:#f8fafc;stroke:#334155;stroke-width:2}.block{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.worker{fill:#ecfdf5;stroke:#047857;stroke-width:2}.domain{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.target{fill:#fff7ed;stroke:#c2410c;stroke-width:2;stroke-dasharray:10 7}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:600 21px system-ui,sans-serif;fill:#0f172a}.text{font:17px system-ui,sans-serif;fill:#334155}.small{font:15px system-ui,sans-serif;fill:#475569}.targetText{fill:#9a3412}</style>
  </defs>
  <rect width="1400" height="860" fill="#fff"/>
  <text x="45" y="45" class="label">Current browser implementation</text>
  <rect x="45" y="75" width="560" height="485" rx="14" class="frame"/>
  <text x="75" y="115" class="label">Main context</text>
  <rect x="95" y="150" width="200" height="105" rx="10" class="block"/>
  <text x="195" y="190" text-anchor="middle" class="label">Semantic UI</text>
  <text x="195" y="222" text-anchor="middle" class="text">Inert DOM publication</text>
  <rect x="355" y="150" width="200" height="105" rx="10" class="block"/>
  <text x="455" y="190" text-anchor="middle" class="label">Controller</text>
  <text x="455" y="222" text-anchor="middle" class="text">Attempt and city state</text>
  <rect x="225" y="330" width="250" height="120" rx="10" class="block"/>
  <text x="350" y="372" text-anchor="middle" class="label">WebGL2 presenter</text>
  <text x="350" y="404" text-anchor="middle" class="text">Camera, input, resources</text>
  <text x="350" y="432" text-anchor="middle" class="small">Staged atomic commit</text>
  <path d="M300 202 H347" class="line"/><path d="M455 258 L390 324" class="line"/><path d="M350 330 L255 260" class="line"/>
  <rect x="760" y="75" width="595" height="485" rx="14" class="frame"/>
  <text x="790" y="115" class="label">One module worker</text>
  <rect x="810" y="150" width="225" height="120" rx="10" class="worker"/>
  <text x="922" y="190" text-anchor="middle" class="label">GitHub gateways</text>
  <text x="922" y="222" text-anchor="middle" class="text">Bounded projection</text>
  <text x="922" y="248" text-anchor="middle" class="small">Still untrusted</text>
  <rect x="1085" y="150" width="220" height="120" rx="10" class="worker"/>
  <text x="1195" y="190" text-anchor="middle" class="label">Attempt pipeline</text>
  <text x="1195" y="222" text-anchor="middle" class="text">Order and ownership</text>
  <text x="1195" y="248" text-anchor="middle" class="small">One terminal result</text>
  <rect x="810" y="335" width="225" height="135" rx="10" class="worker"/>
  <text x="922" y="375" text-anchor="middle" class="label">Admission + parser</text>
  <text x="922" y="407" text-anchor="middle" class="text">Complete ancestry</text>
  <text x="922" y="435" text-anchor="middle" class="text">Sequential source work</text>
  <rect x="1085" y="335" width="220" height="135" rx="10" class="worker"/>
  <text x="1195" y="375" text-anchor="middle" class="label">Metrics + city</text>
  <text x="1195" y="407" text-anchor="middle" class="text">Deterministic facts</text>
  <text x="1195" y="435" text-anchor="middle" class="text">Source-free result</text>
  <path d="M1038 210 H1078" class="line"/><path d="M1195 275 V327" class="line"/><path d="M1038 402 H1078" class="line"/>
  <path d="M605 200 H752" class="line"/>
  <text x="678" y="184" text-anchor="middle" class="small">START</text>
  <path d="M760 445 H615" class="line"/>
  <text x="688" y="429" text-anchor="middle" class="small">aligned city, no source</text>
  <rect x="45" y="605" width="870" height="180" rx="12" class="domain"/>
  <text x="75" y="650" class="label">Domain policy</text>
  <text x="75" y="687" class="text">Repository identity · source admission · metrics and complexity · city construction</text>
  <text x="75" y="721" class="text">camera and picking policy · deterministic ordering and validation</text>
  <text x="75" y="755" class="small">Independent of provider, worker, DOM, and WebGL APIs</text>
  <rect x="960" y="605" width="395" height="180" rx="12" class="target"/>
  <text x="990" y="650" class="label targetText">Accepted target</text>
  <text x="990" y="687" class="text">Server owns acquisition, analysis,</text>
  <text x="990" y="719" class="text">retained source and saved results.</text>
  <text x="990" y="753" class="small targetText">Unimplemented; mechanisms unresolved</text>
</svg>
