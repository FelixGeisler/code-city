<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">Code City building blocks</title>
  <desc id="desc">The browser main context contains the worker bridge, UI attempt coordinator, and WebGL presentation. One processing worker runs a vertical pipeline from revision selection through city construction. Revision selection and source retrieval use the GitHub gateway, which alone communicates with Public GitHub.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    .zone{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}
    .edge{fill:#fef3c7;stroke:#a16207;stroke-width:2}
    .app{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}
    .domain{fill:#dcfce7;stroke:#15803d;stroke-width:2}
    .external{fill:#f8fafc;stroke:#334155;stroke-width:2}
    .title{font:600 20px system-ui,sans-serif;fill:#0f172a}
    .text{font:17px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
    .small{font:14px system-ui,sans-serif;fill:#334155;text-anchor:middle}
    .arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
    .both{fill:none;stroke:#475569;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>

  <rect class="zone" x="40" y="25" width="1020" height="155" rx="12"/>
  <text class="title" x="60" y="58">Browser main context</text>

  <rect class="edge" x="135" y="85" width="250" height="65" rx="8"/>
  <text class="text" x="260" y="124">Worker bridge</text>

  <rect class="app" x="430" y="85" width="250" height="65" rx="8"/>
  <text class="text" x="555" y="113">UI attempt</text>
  <text class="text" x="555" y="134">coordinator</text>

  <rect class="edge" x="755" y="85" width="250" height="65" rx="8"/>
  <text class="text" x="880" y="124">WebGL presentation</text>

  <line class="arrow" x1="395" y1="105" x2="420" y2="105"/>
  <line class="arrow" x1="420" y1="130" x2="395" y2="130"/>
  <line class="arrow" x1="690" y1="117" x2="745" y2="117"/>

  <rect class="zone" x="40" y="230" width="700" height="640" rx="12"/>
  <text class="title" x="60" y="265">Processing worker</text>

  <rect class="app" x="80" y="285" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="311">Worker pipeline</text>
  <text class="text" x="260" y="332">coordinator</text>

  <line class="both" x1="260" y1="160" x2="260" y2="275"/>
  <text class="small" x="340" y="218">commands / outcomes</text>

  <rect class="app" x="80" y="380" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="417">1 · Revision selection</text>

  <rect class="app" x="80" y="460" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="497">2 · Source retrieval</text>

  <rect class="domain" x="80" y="540" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="577">3 · Admission</text>

  <rect class="edge" x="80" y="620" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="657">4 · Parser adapter</text>

  <rect class="domain" x="80" y="700" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="737">5 · Metrics</text>

  <rect class="domain" x="80" y="780" width="360" height="60" rx="8"/>
  <text class="text" x="260" y="817">6 · City builder</text>

  <line class="arrow" x1="260" y1="345" x2="260" y2="370"/>
  <line class="arrow" x1="260" y1="440" x2="260" y2="450"/>
  <line class="arrow" x1="260" y1="520" x2="260" y2="530"/>
  <line class="arrow" x1="260" y1="600" x2="260" y2="610"/>
  <line class="arrow" x1="260" y1="680" x2="260" y2="690"/>
  <line class="arrow" x1="260" y1="760" x2="260" y2="770"/>

  <rect class="edge" x="555" y="420" width="155" height="90" rx="8"/>
  <text class="text" x="632" y="458">GitHub</text>
  <text class="text" x="632" y="480">gateway</text>
  <text class="small" x="632" y="500">used by 1–2</text>

  <line x1="440" y1="410" x2="515" y2="410" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="490" x2="515" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="515" y1="410" x2="515" y2="490" stroke="#475569" stroke-width="2"/>
  <line class="arrow" x1="515" y1="442" x2="545" y2="442"/>
  <line class="arrow" x1="545" y1="458" x2="515" y2="458"/>

  <rect class="external" x="850" y="420" width="200" height="90" rx="8"/>
  <text class="text" x="950" y="458">Public GitHub</text>
  <text class="small" x="950" y="485">REST + source</text>
  <line class="both" x1="720" y1="465" x2="840" y2="465"/>

  <rect class="app" x="790" y="700" width="22" height="22" rx="3"/>
  <text class="small" x="900" y="717">Application coordination</text>
  <rect class="domain" x="790" y="740" width="22" height="22" rx="3"/>
  <text class="small" x="875" y="757">Domain policy</text>
  <rect class="edge" x="790" y="780" width="22" height="22" rx="3"/>
  <text class="small" x="875" y="797">Edge mechanism</text>
</svg>
