name: Container

on:
  pull_request:
    paths:
    - .dockerignore
    - Dockerfile
    - package.json
    - package-lock.json
    - apps/**
    - packages/**
    - tools/**
    - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
    - .dockerignore
    - Dockerfile
    - package.json
    - package-lock.json
    - apps/**
    - packages/**
    - tools/**
    - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
