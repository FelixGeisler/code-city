name: Container

on:
  pull_request:
    paths:
    - .dockerignore
    - Dockerfile
    - LICENSE
    - NOTICE
    - package.json
    - package-lock.json
    - apps/**
    - packages/**
    - tools/**
    - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
    - .dockerignore
    - Dockerfile
    - LICENSE
    - NOTICE
    - package.json
    - package-lock.json
    - apps/**
    - packages/**
    - tools/**
    - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v4
    - name: Load AMD64 smoke image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: code-city:ci-smoke
        cache-from: type=gha
    - name: Smoke runtime permissions, helpers, and health
      shell: bash
      run: |
        set -euo pipefail
        container=code-city-ci-smoke
        volume=code-city-ci-smoke-data
        fixture=
        cleanup() {
          docker rm --force --volumes "$container" >/dev/null 2>&1 || true
          docker volume rm "$volume" >/dev/null 2>&1 || true
          if [ -n "$fixture" ]; then rm -rf "$fixture"; fi
        }
        trap cleanup EXIT

        docker volume create "$volume" >/dev/null
        docker run --detach --name "$container" \
          --publish 127.0.0.1::3000 \
          --volume "$volume:/data" \
          code-city:ci-smoke >/dev/null

        ready=
        for _ in {1..30}; do
          if docker exec "$container" node -e \
            "fetch('http://127.0.0.1:3000/api/v1/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
          then
            ready=1
            break
          fi
          if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
            docker logs "$container"
            exit 1
          fi
          sleep 1
        done
        if [ "$ready" != 1 ]; then
          docker logs "$container"
          exit 1
        fi

        docker exec "$container" sh -eu -c '
          test "$(id -u)" = 10001
          test "$(stat -c %u /app)" = 0
          test ! -w /app
          test -z "$(find /app -xdev \( -type f -o -type d \) \( ! -user root -o -perm /022 \) -print -quit)"
          test "$(stat -c %u /data)" = 10001
          test -w /data
          test -w /tmp
          test -r /app/build/app/apps/server/src/main.js
          test -r /app/LICENSE
          test -r /app/NOTICE
          test -r /app/node_modules/three/LICENSE
          test -r /app/node_modules/typescript/NOTICE.txt
          test -r /app/tools/roslyn-helper/bin/Release/net10.0/codecity-roslyn-helper.dll
          test -r /app/tools/git-credential-helper/bin/Release/net10.0/codecity-git-credential-helper.dll

          set +e
          printf "" | dotnet /app/tools/roslyn-helper/bin/Release/net10.0/codecity-roslyn-helper.dll >/dev/null
          roslyn_status=$?
          dotnet /app/tools/git-credential-helper/bin/Release/net10.0/codecity-git-credential-helper.dll >/dev/null 2>&1
          credential_status=$?
          set -e
          test "$roslyn_status" = 2
          test "$credential_status" = 1
        '

        test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' code-city:ci-smoke)" = 1.0.0
        test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' code-city:ci-smoke)" = Apache-2.0

        port="$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort }}' "$container")"
        base_url="http://127.0.0.1:$port"
        fixture="$(mktemp -d)"
        mkdir -p "$fixture/source/src"
        printf 'export function classify(value: number) { return value > 0 ? "positive" : "other"; }\n' \
          > "$fixture/source/src/main.ts"
        printf 'public static class Sample { public static int Classify(int value) { return value > 0 ? 1 : 0; } }\n' \
          > "$fixture/source/src/Sample.cs"
        (cd "$fixture/source" && zip --quiet --recurse-paths ../source.zip .)

        job_id="$(node tools/container-runtime-smoke.mjs import "$base_url" "$fixture/source.zip")"
        test -n "$job_id"

        docker rm --force "$container" >/dev/null
        docker run --detach --name "$container" \
          --publish 127.0.0.1::3000 \
          --volume "$volume:/data" \
          code-city:ci-smoke >/dev/null
        restored_port="$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort }}' "$container")"
        for _ in {1..30}; do
          if docker exec "$container" node -e \
            "fetch('http://127.0.0.1:3000/api/v1/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
          then
            break
          fi
          sleep 1
        done
        node tools/container-runtime-smoke.mjs restore \
          "http://127.0.0.1:$restored_port" "$job_id"
    - name: Build multi-architecture image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
