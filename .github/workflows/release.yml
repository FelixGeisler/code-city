name: Release

on:
  push:
    tags:
    - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Validate annotated tag on main
      shell: bash
      run: |
        set -euo pipefail
        test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.302
    - run: npm ci
    - name: Validate release identity
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: npm run release:check
    - id: version
      shell: bash
      run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - run: npm audit --audit-level=high
    - run: npm run verify

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.302
    - run: npm ci
    - name: Validate release identity
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: npm run release:check
    - run: npm run verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.302
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run test:viewer-performance
    - run: npm run test:viewer-real-import

  publish-image:
    needs: [contract, verify-windows, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: metadata
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest
        labels: |
          org.opencontainers.image.title=Code City
          org.opencontainers.image.description=Self-hosted software repository visualization and print export
          org.opencontainers.image.licenses=Apache-2.0
          org.opencontainers.image.version=${{ needs.contract.outputs.version }}
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        build-args: CODECITY_VERSION=${{ needs.contract.outputs.version }}
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Verify the release image is anonymously readable
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        repository="${GITHUB_REPOSITORY,,}"
        token="$(curl --fail --silent --show-error \
          "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull" \
          | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => process.stdout.write(JSON.parse(value).token))')"
        actual="$(curl --fail --silent --show-error --head \
          --header "Authorization: Bearer $token" \
          --header "Accept: application/vnd.oci.image.index.v1+json" \
          "https://ghcr.io/v2/$repository/manifests/$GITHUB_REF_NAME" \
          | tr -d '\r' \
          | awk -F ': ' 'tolower($1) == "docker-content-digest" { print $2 }')"
        test "$actual" = "$DIGEST"

  release-smoke:
    needs: [contract, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Smoke the published immutable digest with import and persistence
      shell: bash
      env:
        VERSION: ${{ needs.contract.outputs.version }}
        DIGEST: ${{ needs.publish-image.outputs.digest }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
        container=code-city-release-smoke
        volume=code-city-release-smoke-data
        fixture=
        cleanup() {
          docker rm --force --volumes "$container" >/dev/null 2>&1 || true
          docker volume rm "$volume" >/dev/null 2>&1 || true
          if [ -n "$fixture" ]; then rm -rf "$fixture"; fi
        }
        trap cleanup EXIT

        docker volume create "$volume" >/dev/null
        docker run --detach --name "$container" \
          --env VERSION="$VERSION" \
          --publish 127.0.0.1::3000 \
          --volume "$volume:/data" \
          "$image" >/dev/null
        for _ in {1..30}; do
          if docker exec "$container" node -e \
            "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>r.json()).then(v=>{if(v.status!=='ok'||v.version!==process.env.VERSION)process.exit(1)}).catch(()=>process.exit(1))"
          then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "${ready:-}" != 1 ]; then
          docker logs "$container"
          exit 1
        fi
        docker exec "$container" test -r /app/LICENSE

        port="$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort }}' "$container")"
        fixture="$(mktemp -d)"
        mkdir -p "$fixture/source/src"
        printf 'export function classify(value: number) { return value > 0 ? "positive" : "other"; }\n' \
          > "$fixture/source/src/main.ts"
        printf 'public static class Sample { public static int Classify(int value) { return value > 0 ? 1 : 0; } }\n' \
          > "$fixture/source/src/Sample.cs"
        (cd "$fixture/source" && zip --quiet --recurse-paths ../source.zip .)
        job_id="$(node tools/container-runtime-smoke.mjs import \
          "http://127.0.0.1:$port" "$fixture/source.zip")"

        docker rm --force "$container" >/dev/null
        docker run --detach --name "$container" \
          --publish 127.0.0.1::3000 \
          --volume "$volume:/data" \
          "$image" >/dev/null
        restored_port="$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort }}' "$container")"
        for _ in {1..30}; do
          if docker exec "$container" node -e \
            "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          then
            break
          fi
          sleep 1
        done
        node tools/container-runtime-smoke.mjs restore \
          "http://127.0.0.1:$restored_port" "$job_id"

  github-release:
    needs: [contract, publish-image, release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Create release notes with immutable image digest
      shell: bash
      env:
        VERSION: ${{ needs.contract.outputs.version }}
        DIGEST: ${{ needs.publish-image.outputs.digest }}
      run: |
        cp RELEASE_NOTES.md release-notes.txt
        printf '\n## Container image\n\n`ghcr.io/%s:%s`\n\nDigest: `%s`\n' \
          "${GITHUB_REPOSITORY,,}" "$VERSION" "$DIGEST" \
          >> release-notes.txt
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --verify-tag
        --title "Code City ${{ needs.contract.outputs.version }}"
        --notes-file release-notes.txt
