name: Publish

on:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm ls --all
    - run: npm audit --audit-level=high
    - run: npm run typecheck:node
    - run: npm run verify
    - name: Create and validate the standalone publication record
      run: |
        node --input-type=module <<'NODE'
        import { mkdir, readFile, writeFile } from "node:fs/promises";
        import { createStandalonePublicationRecord, validateStandalonePublicationRecord } from "./tools/standalone-publication-record.mjs";
        const manifest = Uint8Array.from(await readFile("dist/package-manifest.json"));
        const record = createStandalonePublicationRecord({
          repository: process.env.GITHUB_REPOSITORY,
          eventName: process.env.GITHUB_EVENT_NAME,
          eventSha: process.env.GITHUB_SHA,
          runId: Number(process.env.GITHUB_RUN_ID),
          runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
        }, manifest);
        validateStandalonePublicationRecord(record, manifest);
        await mkdir("build/evidence", { recursive: true });
        await writeFile("build/evidence/package-manifest.json", manifest, { flag: "wx" });
        await writeFile("build/evidence/publication-record.json", record, { flag: "wx" });
        NODE
    - name: Upload the audited standalone artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: code-city-standalone-${{ github.sha }}
        path: dist
        if-no-files-found: error
        retention-days: 90
    - name: Upload internal publication evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: code-city-publication-evidence
        path: |
          build/evidence/package-manifest.json
          build/evidence/publication-record.json
        if-no-files-found: error
        retention-days: 90
