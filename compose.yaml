services:
  code-city:
    build:
      context: .
    image: code-city:local
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      CODECITY_HOST: "0.0.0.0"
      CODECITY_PORT: "3000"
      CODECITY_DATA_DIR: "/data"
      CODECITY_ALLOWED_HOSTS: "${CODECITY_ALLOWED_HOSTS:-}"
      CODECITY_ALLOWED_GIT_ORIGINS: "${CODECITY_ALLOWED_GIT_ORIGINS:-}"
      CODECITY_AUTH_TOKEN_FILE: "${CODECITY_AUTH_TOKEN_FILE:-}"
      CODECITY_PUBLIC_ORIGIN: "${CODECITY_PUBLIC_ORIGIN:-}"
      CODECITY_TRUST_WINDOWS_AUTH_TOKEN_FILE: "${CODECITY_TRUST_WINDOWS_AUTH_TOKEN_FILE:-}"
      CODECITY_CREDENTIAL_PROFILES_FILE: "${CODECITY_CREDENTIAL_PROFILES_FILE:-}"
      CODECITY_TRUST_WINDOWS_CREDENTIAL_FILES: "${CODECITY_TRUST_WINDOWS_CREDENTIAL_FILES:-}"
      CODECITY_SOURCE_RETENTION: "${CODECITY_SOURCE_RETENTION:-retain}"
      CODECITY_EDITOR_URL_TEMPLATE: "${CODECITY_EDITOR_URL_TEMPLATE:-}"
    volumes:
      - code-city-data:/data

volumes:
  code-city-data:
