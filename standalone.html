<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code City</title>
</head>
<body>
  <main>
    <header data-app-bar><h1>Code City</h1><button type="button" data-open-saved>Open saved</button></header>
    <form id="repository-setup" novalidate>
      <div role="tablist" aria-label="Source" data-source-tabs>
        <button id="source-local" type="button" role="tab" aria-selected="true" aria-controls="local-setup" data-source-local>Local folder</button>
        <button id="source-github" type="button" role="tab" aria-selected="false" aria-controls="github-setup" tabindex="-1" data-source-github>GitHub URL</button>
      </div>
      <div id="local-setup" role="tabpanel" aria-labelledby="source-local" data-local-setup>
        <button type="button" data-choose-folder>Choose folder</button>
        <bdi data-folder-name dir="auto">No folder selected</bdi>
        <p data-folder-status role="status"></p>
      </div>
      <div id="github-setup" role="tabpanel" aria-labelledby="source-github" data-github-setup hidden>
        <label for="repository">Public GitHub repository, branch, or release URL</label>
        <input id="repository" name="repository" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/repository">
      </div>
      <button type="submit">Analyze</button>
      <details data-exclusions>
        <summary>Exclusions</summary>
        <label for="additional-exclusions">One path per line</label>
        <textarea id="additional-exclusions" name="additional-exclusions" rows="3" autocomplete="off" spellcheck="false"></textarea>
        <p data-exclusions-help>Remove a path to include it on the next Analyze.</p>
      </details>
      <p id="shared-save-info" data-shared-save>Save uploads code and results. Everyone with access can read them.</p>
    </form>
    <header data-investigation hidden>
      <div data-investigation-identity>
        <bdi data-repository dir="auto"></bdi>
        <div data-origin-identity><span data-origin-label>Commit</span><output data-commit aria-live="polite"></output></div>
      </div>
      <div data-investigation-controls>
        <button type="button" data-change-repository aria-controls="repository-setup" aria-expanded="false">Change source</button>
        <button type="button" data-save aria-describedby="shared-save-info" title="Save uploads analyzed source and results. Everyone reaching this instance can read them." hidden>Save</button>
      </div>
    </header>
    <p data-save-status role="status"></p>
    <dialog data-saved-picker aria-labelledby="saved-picker-title">
      <header><h2 id="saved-picker-title">Saved investigations</h2><button type="button" data-close-saved>Close</button></header>
      <p data-saved-message role="status"></p>
      <div data-saved-projects></div>
    </dialog>
    <p data-feedback role="alert" aria-live="polite"></p>
    <section data-status aria-live="polite"></section>
    <section data-presentation hidden></section>
    <details data-failed hidden>
      <summary data-failed-summary></summary>
      <ul data-failed-rows></ul>
    </details>
  </main>
  <script type="module" src="/src/edge/standalone-browser-main.ts"></script>
</body>
</html>
